# Exemplo: monorepo com 2 serviços (api + worker).
# Tags per-service publicam só aquele serviço.
#
# COPIA pra .github/workflows/publish.yml no SEU repo.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'              # publica AMBOS
      - 'api-v*.*.*'          # publica só api
      - 'worker-v*.*.*'       # publica só worker
  workflow_dispatch:
    inputs:
      service:
        description: 'Qual publicar (all|api|worker)'
        required: false
        default: 'all'

jobs:
  publish-api:
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/api-v') ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'api'
    uses: Beetax-Technologies/.github/.github/workflows/publish-docker.yml@v1
    with:
      service-name: api
      context: services/api
      dockerfile: services/api/Dockerfile
    permissions:
      contents: read
      packages: write

  publish-worker:
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/worker-v') ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'worker'
    uses: Beetax-Technologies/.github/.github/workflows/publish-docker.yml@v1
    with:
      service-name: worker
      context: services/worker
      dockerfile: services/worker/Dockerfile
    permissions:
      contents: read
      packages: write
